services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: FleetCoreAPI

    ports:
      - "${PORT}:${PORT}"

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - NODE_ENV=development
    networks:
      - backend
    command: ["npm", "run", "start:docker"]

  db:
    image: postgres:16-alpine
    container_name: FleetCoreDatabase
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge